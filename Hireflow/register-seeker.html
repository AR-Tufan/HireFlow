<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register as Seeker - HireFlow</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Job Seeker Registration</h2>
            <form action="login.html">
                <div class="form-group"><label>Full Name</label><input type="text" placeholder="Full Name" required></div>
                <div class="form-group"><label>Email</label><input type="email" placeholder="Email" required></div>
                <div class="form-group"><label>Password</label><input type="password" placeholder="Password" required></div>
                <div class="form-group"><label>Confirm Password</label><input type="password" placeholder="Confirm Password" required></div>
                <button type="submit" class="btn btn-primary btn-block">Register</button>
            </form>
        </div>
    </div>
<script src="js/validation.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
