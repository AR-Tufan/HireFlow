<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - HireFlow</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
      <div class="container nav-container">
        <a href="index.html" class="logo"><span class="logo-text">Hire<span>Flow</span></span></a>
        <div class="nav-actions"><a href="login.html" class="btn btn-outline">Login</a></div>
      </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Create an Account</h2>
            <p class="subtitle">Join HireFlow today</p>
            <form action="login.html">
                <div class="form-group">
                    <label>Full Name / Company Name</label>
                    <input type="text" placeholder="Enter your name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Register As</label>
                    <select>
                        <option value="seeker">Job Seeker</option>
                        <option value="employer">Employer</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Create a password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Register</button>
            </form>
        </div>
    </div>
<script src="js/validation.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
