<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employer Verification - HireFlow Admin</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
      <div class="container nav-container">
        <a href="index.html" class="logo"><span class="logo-text" style="color: red;">Hire<span>Flow</span> Admin</span></a>
        <div class="nav-actions"><a href="login.html" class="btn btn-outline">Logout</a></div>
      </div>
    </header>

    <div class="container">
        <div class="dashboard-layout">
            <aside class="sidebar">
                <div class="sidebar-menu">
                    <a href="admin-dashboard.html">Dashboard</a>
                    <a href="admin-users.html">Manage Users</a>
                    <a href="admin-employers.html" class="active">Employer Verification</a>
                    <a href="admin-jobs.html">Job Moderation</a>
                </div>
            </aside>

            <main class="dashboard-content">
                <div class="dashboard-box">
                    <h2 style="margin-bottom: 20px;">Pending Employer Verifications</h2>
                    
                    <table style="width: 100%; text-align: left; border-collapse: collapse;">
                        <thead>
                            <tr style="border-bottom: 2px solid var(--border-color);">
                                <th style="padding: 10px 0;">Company Name</th>
                                <th>Contact Person</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr style="border-bottom: 1px solid var(--border-color);">
                                <td style="padding: 15px 0; font-weight: 500;">ABC Technologies</td>
                                <td>Karim Khan<br><span style="font-size: 12px; color: var(--text-muted);">karim@abc.com</span></td>
                                <td><span style="color: #92400e; font-weight: 500;">Pending</span></td>
                                <td>
                                    <button class="btn btn-primary" style="padding: 5px 10px; font-size: 12px;">Verify</button>
                                    <button class="btn btn-outline" style="padding: 5px 10px; font-size: 12px; color: red; border-color: red;">Reject</button>
                                </td>
                            </tr>
                            <tr style="border-bottom: 1px solid var(--border-color);">
                                <td style="padding: 15px 0; font-weight: 500;">XYZ Solutions</td>
                                <td>Sadia Islam<br><span style="font-size: 12px; color: var(--text-muted);">sadia@xyz.com</span></td>
                                <td><span style="color: #166534; font-weight: 500;">Verified</span></td>
                                <td>
                                    <span style="font-size: 12px; color: var(--text-muted);">No actions needed</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

<script src="js/main.js"></script>
<script src="js/dashboard.js"></script>

</html>
