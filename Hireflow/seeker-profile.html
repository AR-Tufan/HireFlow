<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - HireFlow</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
      <div class="container nav-container">
        <a href="index.html" class="logo"><span class="logo-text">Hire<span>Flow</span></span></a>
        <div class="nav-actions">
          <span style="font-weight: 500;">Hi, Job Seeker</span>
          <a href="login.html" class="btn btn-outline">Logout</a>
        </div>
      </div>
    </header>

    <div class="container">
        <div class="dashboard-layout">
            <aside class="sidebar">
                <div class="sidebar-menu">
                    <a href="seeker-dashboard.html">Dashboard</a>
                    <a href="seeker-profile.html" class="active">My Profile</a>
                    <a href="seeker-resume.html">My Resume / CV</a>
                    <a href="seeker-applications.html">My Applications</a>
                    <a href="seeker-saved-jobs.html">Saved Jobs</a>
                </div>
            </aside>

            <main class="dashboard-content">
                <div class="dashboard-box">
                    <h2 style="margin-bottom: 20px;">Update Profile</h2>
                    
                    <form>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <div class="form-group">
                                <label>Full Name</label>
                                <input type="text" placeholder="Enter your full name" value="John Doe">
                            </div>
                            <div class="form-group">
                                <label>Email Address</label>
                                <input type="email" placeholder="Enter email" value="johndoe@email.com">
                            </div>
                            <div class="form-group">
                                <label>Phone Number</label>
                                <input type="text" placeholder="Enter phone" value="+880 1700-000000">
                            </div>
                            <div class="form-group">
                                <label>Location</label>
                                <input type="text" placeholder="City, Country" value="Dhaka, Bangladesh">
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>Professional Summary</label>
                            <textarea rows="4" placeholder="Write a short summary..." style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: var(--radius); font-family: var(--font-family);"></textarea>
                        </div>

                        <button type="button" class="btn btn-primary">Save Changes</button>
                    </form>
                </div>
            </main>
        </div>
    </div>

    <script src="js/main.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
