<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Jobs - HireFlow</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
      <div class="container nav-container">
        <a href="index.html" class="logo"><span class="logo-text">Hire<span>Flow</span></span></a>
        <div class="nav-actions">
          <span style="font-weight: 500;">Hi, Employer</span>
          <a href="login.html" class="btn btn-outline">Logout</a>
        </div>
      </div>
    </header>

    <div class="container">
        <div class="dashboard-layout">
            <!-- Employer Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-menu">
                    <a href="employer-dashboard.html">Dashboard</a>
                    <a href="employer-jobs.html" class="active">My Jobs</a>
                    <a href="employer-create-job.html">Post a New Job</a>
                    <a href="employer-applicants.html">Applicants</a>
                    <a href="employer-ranking.html">Candidate Ranking</a>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="dashboard-content">
                <div class="dashboard-box" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>My Posted Jobs</h2>
                    <a href="employer-create-job.html" class="btn btn-primary">+ Post New Job</a>
                </div>

                <div class="dashboard-box">
                    <table style="width: 100%; text-align: left; border-collapse: collapse;">
                        <thead>
                            <tr style="border-bottom: 2px solid var(--border-color);">
                                <th style="padding: 10px 0;">Job Title</th>
                                <th>Posted Date</th>
                                <th>Applicants</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr style="border-bottom: 1px solid var(--border-color);">
                                <td style="padding: 15px 0; font-weight: 500;">Senior React Developer</td>
                                <td style="font-size: 14px; color: var(--text-muted);">12 Oct 2026</td>
                                <td>15</td>
                                <td><span style="background: #dcfce7; color: #166534; padding: 4px 8px; border-radius: 4px; font-size: 12px;">Active</span></td>
                                <td>
                                    <a href="employer-applicants.html" class="btn btn-outline" style="padding: 5px 10px; font-size: 12px;">View Applicants</a>
                                </td>
                            </tr>
                            <tr style="border-bottom: 1px solid var(--border-color);">
                                <td style="padding: 15px 0; font-weight: 500;">UI/UX Designer</td>
                                <td style="font-size: 14px; color: var(--text-muted);">05 Oct 2026</td>
                                <td>30</td>
                                <td><span style="background: #fee2e2; color: #991b1b; padding: 4px 8px; border-radius: 4px; font-size: 12px;">Closed</span></td>
                                <td>
                                    <a href="employer-applicants.html" class="btn btn-outline" style="padding: 5px 10px; font-size: 12px;">View Applicants</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

<script src="js/main.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
