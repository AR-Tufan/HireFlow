<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seeker Dashboard - HireFlow</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
      <div class="container nav-container">
        <a href="index.html" class="logo"><span class="logo-text">Hire<span>Flow</span></span></a>
        <div class="nav-actions">
          <span style="font-weight: 500;">Hi, Job Seeker</span>
          <a href="login.html" class="btn btn-outline">Logout</a>
        </div>
      </div>
    </header>

    <div class="container">
        <div class="dashboard-layout">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-menu">
                    <a href="seeker-dashboard.html" class="active">Dashboard</a>
                    <a href="seeker-profile.html">My Profile</a>
                    <a href="seeker-resume.html">My Resume / CV</a>
                    <a href="seeker-applications.html">My Applications</a>
                    <a href="seeker-saved-jobs.html">Saved Jobs</a>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="dashboard-content">
                <h2>Dashboard Overview</h2>
                
                <!-- Stats -->
                <div class="stat-grid">
                    <div class="stat-card">
                        <h4>Total Applications</h4>
                        <h2>12</h2>
                    </div>
                    <div class="stat-card" style="border-left-color: var(--secondary-color);">
                        <h4>Shortlisted</h4>
                        <h2>3</h2>
                    </div>
                    <div class="stat-card" style="border-left-color: #f59e0b;">
                        <h4>Interviews</h4>
                        <h2>1</h2>
                    </div>
                </div>

                <!-- Recent Applications -->
                <div class="dashboard-box">
                    <h3 style="margin-bottom: 15px;">Recent Applications</h3>
                    <table style="width: 100%; text-align: left; border-collapse: collapse;">
                        <tr style="border-bottom: 1px solid var(--border-color);">
                            <th style="padding: 10px 0;">Job Title</th>
                            <th>Company</th>
                            <th>Status</th>
                        </tr>
                        <tr>
                            <td style="padding: 10px 0;">Frontend Developer</td>
                            <td>Google</td>
                            <td><span style="background: #dcfce7; color: #166534; padding: 3px 8px; border-radius: 4px; font-size: 12px;">Shortlisted</span></td>
                        </tr>
                        <tr>
                            <td style="padding: 10px 0;">React Developer</td>
                            <td>Brain Station 23</td>
                            <td><span style="background: #f3f4f6; color: #374151; padding: 3px 8px; border-radius: 4px; font-size: 12px;">Pending</span></td>
                        </tr>
                    </table>
                </div>
            </main>
        </div>
    </div>

<script src="js/main.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
