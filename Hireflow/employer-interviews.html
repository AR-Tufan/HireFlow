<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interviews - HireFlow</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
      <div class="container nav-container">
        <a href="index.html" class="logo"><span class="logo-text">Hire<span>Flow</span></span></a>
        <div class="nav-actions">
          <a href="login.html" class="btn btn-outline">Logout</a>
        </div>
      </div>
    </header>

    <div class="container">
        <div class="dashboard-layout">
            <aside class="sidebar">
                <div class="sidebar-menu">
                    <a href="employer-dashboard.html">Dashboard</a>
                    <a href="employer-jobs.html">My Jobs</a>
                    <a href="employer-create-job.html">Post a New Job</a>
                    <a href="employer-applicants.html">Applicants</a>
                    <a href="employer-interviews.html" class="active">Interviews</a>
                </div>
            </aside>

            <main class="dashboard-content">
                <div class="dashboard-box" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                    <h2>Scheduled Interviews</h2>
                    <button class="btn btn-primary">+ Schedule Interview</button>
                </div>

                <div class="dashboard-box">
                    <table style="width: 100%; text-align: left; border-collapse: collapse;">
                        <thead>
                            <tr style="border-bottom: 2px solid var(--border-color);">
                                <th style="padding: 10px 0;">Candidate</th>
                                <th>Job Position</th>
                                <th>Date & Time</th>
                                <th>Platform</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr style="border-bottom: 1px solid var(--border-color);">
                                <td style="padding: 15px 0; font-weight: 500;">Rahim Ahmed</td>
                                <td>Senior React Developer</td>
                                <td>20 Oct 2026, 10:00 AM</td>
                                <td>Google Meet</td>
                                <td><span style="background: #dcfce7; color: #166534; padding: 4px 8px; border-radius: 4px; font-size: 12px;">Upcoming</span></td>
                            </tr>
                            <tr style="border-bottom: 1px solid var(--border-color);">
                                <td style="padding: 15px 0; font-weight: 500;">Sadia Islam</td>
                                <td>UI/UX Designer</td>
                                <td>18 Oct 2026, 02:00 PM</td>
                                <td>Zoom</td>
                                <td><span style="background: #f3f4f6; color: #374151; padding: 4px 8px; border-radius: 4px; font-size: 12px;">Completed</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

<script src="js/main.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
