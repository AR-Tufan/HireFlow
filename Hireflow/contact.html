<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us - HireFlow</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
      <div class="container nav-container">
        <a href="index.html" class="logo"><span class="logo-text">Hire<span>Flow</span></span></a>
        <div class="nav-actions"><a href="login.html" class="btn btn-outline">Login</a></div>
      </div>
    </header>

    <div class="container" style="margin-top: 40px;">
        <div class="dashboard-box" style="max-width: 600px; margin: 0 auto;">
            <h2 style="margin-bottom: 20px; text-align: center;">Contact Support</h2>
            <form>
                <div class="form-group">
                    <label>Your Name</label>
                    <input type="text" placeholder="Enter your name">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="5" placeholder="How can we help you?" style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: var(--radius); font-family: var(--font-family);"></textarea>
                </div>
                <button type="button" class="btn btn-primary btn-block">Send Message</button>
            </form>
        </div>
    </div>


<script src="js/main.js"></script>
<script src="js/jobs.js"></script>

</body>
</html>
