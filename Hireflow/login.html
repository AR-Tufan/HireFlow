<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HireFlow</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
      <div class="container nav-container">
        <a href="index.html" class="logo"><span class="logo-text">Hire<span>Flow</span></span></a>
        <div class="nav-actions"><a href="register.html" class="btn btn-primary">Register</a></div>
      </div>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p class="subtitle">Login to your HireFlow account</p>
            <form action="seeker-dashboard.html">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>
            <p style="text-align: center; margin-top: 20px; font-size: 14px;">
                Don't have an account? <a href="register.html">Register here</a>
            </p>
        </div>
    </div>
<script src="js/validation.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
