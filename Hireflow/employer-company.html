<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Company Profile - HireFlow</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
      <div class="container nav-container">
        <a href="index.html" class="logo"><span class="logo-text">Hire<span>Flow</span></span></a>
      </div>
    </header>
    <div class="container">
        <div class="dashboard-layout">
            <aside class="sidebar">
                <div class="sidebar-menu">
                    <a href="employer-dashboard.html">Dashboard</a>
                    <a href="employer-company.html" class="active">Company Profile</a>
                </div>
            </aside>
            <main class="dashboard-content">
                <div class="dashboard-box">
                    <h2>Edit Company Profile</h2>
                    <form style="margin-top: 20px;">
                        <div class="form-group"><label>Company Name</label><input type="text" value="Tech BD Ltd."></div>
                        <div class="form-group"><label>Website</label><input type="text" value="www.techbd.com"></div>
                        <div class="form-group"><label>About Company</label><textarea rows="4" style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: var(--radius); font-family: var(--font-family);">We are a leading software company in Bangladesh.</textarea></div>
                        <button type="button" class="btn btn-primary">Save Changes</button>
                    </form>
                </div>
            </main>
        </div>
    </div>

<script src="js/main.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
