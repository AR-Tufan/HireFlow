<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employer Dashboard - HireFlow</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
      <div class="container nav-container">
        <a href="index.html" class="logo"><span class="logo-text">Hire<span>Flow</span></span></a>
        <div class="nav-actions">
          <span style="font-weight: 500;">Hi, Employer</span>
          <a href="login.html" class="btn btn-outline">Logout</a>
        </div>
      </div>
    </header>

    <div class="container">
        <div class="dashboard-layout">
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-menu">
                    <a href="employer-dashboard.html" class="active">Dashboard</a>
                    <a href="employer-jobs.html">My Jobs</a>
                    <a href="employer-create-job.html">Post a New Job</a>
                    <a href="employer-applicants.html">Applicants</a>
                    <a href="employer-ranking.html">Candidate Ranking</a>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="dashboard-content">
                <h2>Employer Overview</h2>
                
                <!-- Stats -->
                <div class="stat-grid">
                    <div class="stat-card">
                        <h4>Active Jobs</h4>
                        <h2>4</h2>
                    </div>
                    <div class="stat-card" style="border-left-color: var(--secondary-color);">
                        <h4>Total Applicants</h4>
                        <h2>45</h2>
                    </div>
                    <div class="stat-card" style="border-left-color: #f59e0b;">
                        <h4>Interviews Scheduled</h4>
                        <h2>6</h2>
                    </div>
                </div>

                <!-- Recent Jobs -->
                <div class="dashboard-box">
                    <h3 style="margin-bottom: 15px;">My Posted Jobs</h3>
                    <table style="width: 100%; text-align: left; border-collapse: collapse;">
                        <tr style="border-bottom: 1px solid var(--border-color);">
                            <th style="padding: 10px 0;">Job Title</th>
                            <th>Applicants</th>
                            <th>Status</th>
                        </tr>
                        <tr>
                            <td style="padding: 10px 0;">Senior React Developer</td>
                            <td>15</td>
                            <td><span style="background: #dcfce7; color: #166534; padding: 3px 8px; border-radius: 4px; font-size: 12px;">Active</span></td>
                        </tr>
                        <tr>
                            <td style="padding: 10px 0;">UI/UX Designer</td>
                            <td>30</td>
                            <td><span style="background: #dcfce7; color: #166534; padding: 3px 8px; border-radius: 4px; font-size: 12px;">Active</span></td>
                        </tr>
                    </table>
                </div>
            </main>
        </div>
    </div>

<script src="js/main.js"></script>
<script src="js/dashboard.js"></script>

</body>
</html>
